    <!-- ─── JSON-LD: FAQPage (AEO) ─── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What compliance checks does Veriyo track for aged care workers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Veriyo tracks all mandatory compliance requirements for aged care workers in Australia, including: National Police Checks, NDIS Worker Screening checks, Working With Children Checks (WWCC), aged care qualifications (Certificate III and IV), First Aid and CPR certificates, and mandatory policy acknowledgements such as the Aged Care Code of Conduct. Veriyo flags expiring credentials before they lapse so providers are never caught out in an audit."
          }
        },
        {
          "@type": "Question",
          "name": "Does Veriyo support NDIS Worker Screening compliance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Veriyo is built to support NDIS providers with Worker Screening compliance — tracking which workers hold a current NDIS Worker Screening clearance, flagging those who are pending or expired, and maintaining records for audit purposes. Veriyo also monitors the NDIS banning order register so providers can check whether a worker is listed before they begin work."
          }
        },
        {
          "@type": "Question",
          "name": "How does Veriyo help early learning centres with compliance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For early learning centres and childcare providers, Veriyo tracks Working With Children Checks (WWCC), early childhood education qualifications, First Aid certificates, and Anaphylaxis management training. Veriyo also supports child safety compliance frameworks including the National Child Safe Standards and ACECQA educator qualification requirements."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between Veriyo Onboard and Veriyo Verify?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Veriyo Onboard manages the compliance pipeline for new employees — collecting documents, tracking clearances, and ensuring every worker is fully compliant before Day 1. Veriyo Verify manages ongoing compliance for contractors, agency staff, locums, and allied health professionals who visit your facility, ensuring every visitor is screened and credentialled before they set foot on site."
          }
        },
        {
          "@type": "Question",
          "name": "Is Veriyo suitable for multi-site aged care or NDIS providers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Veriyo is designed for Australian care providers of all sizes, from single-site operations to multi-site aged care and NDIS organisations. The platform gives compliance managers a single dashboard across their entire workforce, with the ability to filter by site, sector, role type, and compliance status. Audit reports can be generated for individual sites or the whole organisation."
          }
        },
        {
          "@type": "Question",
          "name": "How does Veriyo help providers prepare for an aged care audit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Veriyo generates a one-click Compliance Audit Report that gives auditors a complete picture of workforce compliance — including every worker's credential status, policy acknowledgements, and any outstanding items. The report covers all mandatory documents, expiry dates, and compliance percentages. Instead of pulling records one by one, providers can hand auditors a comprehensive report in seconds."
          }
        }
      ]
    }
    </script>
